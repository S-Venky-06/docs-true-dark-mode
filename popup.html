<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo-glow"></div>
    <img src="images/icon-48.png" alt="Icon" class="logo">
    <div class="title-container">
      <h2>Docs Dark Mode</h2>
      <span class="badge">Premium</span>
    </div>
  </div>
  
  <div class="card toggle-card">
    <div class="toggle-info">
      <div class="label-group">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span class="label">Enable Theme</span>
        <span class="status-dot" id="statusDot"></span>
      </div>
      <span class="sub-label" id="themeStatus">Active across open documents</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="darkModeToggle" aria-label="Toggle Dark Mode">
      <span class="slider"></span>
    </label>
  </div>

  <div class="card slider-card">
    <div class="slider-header">
      <div class="label-group">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span class="label">Paper Brightness</span>
      </div>
      <span id="brightnessValue" class="value-badge">110%</span>
    </div>
    
    <div class="preview-strip">
      <div class="preview-strip-fill" id="previewStrip"></div>
    </div>
    
    <div class="range-wrapper">
      <input type="range" id="brightnessSlider" min="50" max="150" value="110" aria-label="Adjust Paper Brightness">
    </div>
    
    <div class="presets-row">
      <button class="preset-chip" data-value="70">Dim</button>
      <button class="preset-chip" data-value="110">Default</button>
      <button class="preset-chip" data-value="140">Bright</button>
    </div>
  </div>

  <div class="footer">
    <div class="shortcut-pill">
      <kbd>Alt</kbd> + <kbd>D</kbd> to toggle
    </div>
    <span class="version-badge">v2.1</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
